<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Courier New', Courier, 'Liberation Mono', monospace">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.3"/></pattern></defs>
<style>text{white-space:pre}.cur{animation:cur 1s steps(1) infinite}@keyframes cur{0%{opacity:1}50%{opacity:0}}.sweep{animation:sweep 3.4s linear infinite;transform-origin:0 0}@keyframes sweep{to{transform:rotate(360deg)}}.blip{animation:blip 3.4s ease-out infinite}@keyframes blip{0%,10%{opacity:0}12%{opacity:1}60%,100%{opacity:0}}</style>
<rect width="900" height="260" fill="#05060f"/><rect x="8" y="8" width="884" height="244" rx="12" fill="#03050c" stroke="#164250" stroke-width="1.5"/><circle cx="34" cy="32" r="7" fill="#ff5f56"/><circle cx="58" cy="32" r="7" fill="#ffbd2e"/><circle cx="82" cy="32" r="7" fill="#27c93f"/><text x="450" y="37" font-size="13" fill="#5b7a88" text-anchor="middle">system diagnostics</text><text x="40" y="84" font-size="15" fill="#00ff9c">[+] <tspan fill="#e8f1ff">RUNNING SYSTEM DIAGNOSTICS...</tspan></text><text x="64" y="114" font-size="15" fill="#e8f1ff">STATUS     <tspan fill="#ff5f56">&gt;</tspan> <tspan fill="#ffe14d">ONLINE</tspan></text><text x="64" y="140" font-size="15" fill="#e8f1ff">MODE       <tspan fill="#ff5f56">&gt;</tspan> <tspan fill="#ffe14d">ETHICAL ONLY</tspan></text><text x="64" y="166" font-size="15" fill="#e8f1ff">VISITOR    <tspan fill="#ff5f56">&gt;</tspan> <tspan fill="#ffe14d">CONNECTION ESTABLISHED</tspan></text><text x="40" y="206" font-size="15"><tspan fill="#00ff9c">liroxs@sandbox</tspan><tspan fill="#e8f1ff">:~$ cat contact.log</tspan></text><rect class="cur" x="337" y="192" width="9" height="18" fill="#00ff9c"/><text x="40" y="232" font-size="14"><tspan fill="#ff5f56">[SYSTEM]</tspan><tspan fill="#e8f1ff"> connection to viewer established — no further errors logged.</tspan></text><g transform="translate(760,138)"><circle r="70" fill="#03120f" stroke="#00ff9c" stroke-opacity=".5"/><circle r="46" fill="none" stroke="#00ff9c" stroke-opacity=".3"/><circle r="22" fill="none" stroke="#00ff9c" stroke-opacity=".3"/><line x1="-70" y1="0" x2="70" y2="0" stroke="#00ff9c" stroke-opacity=".25"/><line x1="0" y1="-70" x2="0" y2="70" stroke="#00ff9c" stroke-opacity=".25"/><path class="sweep" d="M0 0 L70 0 A70 70 0 0 0 49.5 -49.5 Z" fill="#00ff9c" fill-opacity=".35"/><circle class="blip" cx="30" cy="-28" r="4" fill="#ffe14d"/><circle class="blip" cx="-34" cy="20" r="3" fill="#00e5ff" style="animation-delay:-1.7s"/></g><rect x="8" y="8" width="884" height="244" rx="12" fill="url(#scan)" pointer-events="none"/>
</svg>
